<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>admin dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../../Styles/style.css" />
    <style>
      .admin-logo {
        color: var(--mainColor) !important;
      }
      .mainwrapper {
        display: flex;
        min-height: 100vh;
      }

      @media (max-width: 991px) {
        .mainwrapper {
          flex-direction: column;
        }
      }
      #user-name:hover {
        cursor: default;
        background: transparent;
        font-weight: bolder;
      }
      .sidebar {
        display: flex;
        flex-direction: column;

        flex: 1;
      }
      .content {
        display: flex;
        flex: 10;
        padding: 20px;
      }
      .navbar {
        border-bottom: none;
      }
      .sidebar .nav-item.active::after,
      .sidebar .nav-item:has(.active)::after {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#"
          ><span class="admin-logo">Admin </span>
          Dashboard
        </a>
        <!-- this button for collapse nav bar if navbar-expand specified in the nav bar  -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-sm-0">
            <li class="nav-item">
              <a class="nav-link" id="user-name" href="#"></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="../../index.html">home</a>
            </li>
            <!-- Divider only shown in collapsed (mobile) view -->
            <li class="nav-item d-sm-none">
              <hr class="border-secondary my-1" />
            </li>
            <li class="nav-item">
              <a class="nav-link" id="logout-btn" href="#">logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="mainwrapper">
      <div class="sidebar bg-dark text-light p-3">
        <!-- nav pills for the button -->
        <ul
          class="nav flex-lg-column flex-row nav-pills justify-content-around justify-content-lg-start gap-3s"
        >
          <li class="nav-item">
            <a class="nav-link text-light active" href="#">Users</a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link text-light"
              href="../seller/seller_dashboard.html"
              >Products</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" href="./admin-orders.html">Orders</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" href="./admin-analytics.html"
              >User Analytics</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" href="./admin-orders-analytics.html"
              >Orders Analytics</a
            >
          </li>
        </ul>
      </div>
      <div class="content flex-column w-100">
        <!-- Top Controls -->
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 w-100"
        >
          <!-- Search Bar -->
          <div class="input-group w-100 w-md-50">
            <input
              type="text"
              class="form-control"
              placeholder="Search users..."
            />
            <button class="btn btn-outline-secondary" type="button">
              Search
            </button>
          </div>

          <!-- Add User Button -->
          <button
            class="btn btn-success"
            onclick="window.location.href = './createuser.html'"
          >
            &plus;
          </button>
        </div>
        <!-- Stats Bar -->
        <div class="row g-3 mb-4 w-100">
          <!-- Total Users - Blue -->
          <div class="col-6 col-md-3">
            <div
              class="rounded-3 px-3 py-3 d-flex align-items-center gap-2 text-white"
              style="background-color: #2563eb"
            >
              <span style="font-size: 1.8rem">👥</span>
              <div>
                <div class="fw-bold fs-5" id="total-users">0</div>
                <div class="small opacity-75">Total Users</div>
              </div>
            </div>
          </div>

          <!-- Admins - Purple -->
          <div class="col-6 col-md-3">
            <div
              class="rounded-3 px-3 py-3 d-flex align-items-center gap-2 text-white"
              style="background-color: #7c3aed"
            >
              <span style="font-size: 1.8rem">🔒</span>
              <div>
                <div class="fw-bold fs-5" id="total-admins">0</div>
                <div class="small opacity-75">Admins</div>
              </div>
            </div>
          </div>

          <!-- Sellers - Emerald Green -->
          <div class="col-6 col-md-3">
            <div
              class="rounded-3 px-3 py-3 d-flex align-items-center gap-2 text-white"
              style="background-color: #059669"
            >
              <span style="font-size: 1.8rem">🛒</span>
              <div>
                <div class="fw-bold fs-5" id="total-sellers">0</div>
                <div class="small opacity-75">Sellers</div>
              </div>
            </div>
          </div>

          <!-- Customers - Amber -->
          <div class="col-6 col-md-3">
            <div
              class="rounded-3 px-3 py-3 d-flex align-items-center gap-2 text-white"
              style="background-color: #d97706"
            >
              <span style="font-size: 1.8rem">🧑‍💼</span>
              <div>
                <div class="fw-bold fs-5" id="total-customers">0</div>
                <div class="small opacity-75">Customers</div>
              </div>
            </div>
          </div>
        </div>
        <!-- Users Cards Container -->
        <div class="container-fluid">
          <div class="row g-4" id="users">
            <!-- User Card -->
          </div>
        </div>
      </div>
    </div>
    <!-- ══════════ DELETE CONFIRMATION MODAL ══════════ -->
    <div
      class="modal fade"
      id="deleteModal"
      tabindex="-1"
      aria-labelledby="deleteModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header modal-header-danger">
            <h5 class="modal-title" id="deleteModalLabel">Delete User</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body py-4 text-center">
            <p class="mb-1 fs-5">Are you sure you want to delete</p>
            <p class="fs-5 mb-3">
              <span class="delete-user-name" id="deleteUserName">this user</span
              >?
            </p>
            <p class="text-muted small mb-0">This action cannot be undone.</p>
          </div>

          <div class="modal-footer justify-content-center gap-2 border-0 pb-4">
            <button
              type="button"
              class="btn btn-outline-secondary px-4"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-danger px-4"
              id="confirmDeleteBtn"
            >
              Yes, Delete
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- bootstrap -->
    <script src="../../Scripts/DB.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../../Scripts/admin/admin-dashboard.js"></script>
  </body>
</html>
