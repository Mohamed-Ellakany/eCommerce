<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard</title>
</head>
<!-- Font Awesome CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<!-- Bootstrap CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<!-- Animate.css -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
<!-- Team CSS -->
<link rel="stylesheet" href="Styles/style.css">
<link rel="stylesheet" href="Styles/Home.css">
<link rel="stylesheet" href="Styles/media.css">

<style>
    
    img{
        border-radius: 4px;
    }

    .img-wrap {
        background: #F5F5F5;
        border-radius: 4px;
        overflow: hidden;      /* keeps grow inside the box */
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 200px;
    }

    .img-wrap img {
        height: 160px;
        width: 160px;
        object-fit: contain;
        cursor: pointer;
        transition: transform 0.3s ease;
    }

    .img-wrap img:hover {
        transform: scale(1.1);
    }
    img:hover {
        transform: scale(1.1);
        transition-duration: 0.3s;
    }
</style>

<body>

<!-- View Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-product-name">Product Name</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <img id="modal-product-img" src="" class="img-fluid mb-3 rounded" style="max-height:200px;">
                <p><strong>Price:</strong> $<span id="modal-product-price"></span></p>
                <p><strong>Stock:</strong> <span id="modal-product-stock"></span></p>
                <p id="modal-product-description" class="text-muted"></p>
            </div>
            <div class="modal-footer justify-content-between">
                <button class="btn btn-danger" id="btn-delete">
                    <i class="fas fa-trash me-1"></i> Delete
                </button>
                <button class="btn btn-warning" id="btn-edit">
                    <i class="fas fa-edit me-1"></i> Edit
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Edit / Add Product Modal -->
<div class="modal fade" id="editmodal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="edit-modal-title">Edit Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" class="form-control" id="product-name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Price</label>
                    <input type="number" class="form-control" id="price">
                </div>
                <div class="mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" class="form-control" id="stock">
                </div>
                <div class="mb-3">
                    <label class="form-label">Image</label>
                    <input type="file" class="form-control" id="image" accept="image/*">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" id="description" rows="3"></textarea>
                </div>
                <div id="form-error" class="alert alert-danger d-none"></div>
            </div>
            <div class="modal-footer justify-content-between">
                <button class="btn btn-danger" data-bs-dismiss="modal">
                    <i class="fa-solid fa-x me-1"></i> Cancel
                </button>
                <button class="btn btn-warning" id="btn-save">
                    <i class="fas fa-save me-1"></i> Save
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete <strong id="delete-product-name"></strong>?</p>
            </div>
            <div class="modal-footer justify-content-between">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger btn-sm" id="btn-confirm-delete">Delete</button>
            </div>
        </div>
    </div>
</div>


<!-- Mobile Search -->
<div class="d-lg-none d-md-none p-3 bg-light border-top">
    <div class="position-relative w-100">
        <input class="form-control rounded-5 py-2 ps-4 pe-5" type="search" placeholder="What are you looking for?" />
        <i class="fas fa-search position-absolute top-50 end-0 me-3 translate-middle-y text-secondary"></i>
    </div>
</div>

<!-- Dashboard -->
<div class="container py-4">

    <!-- Add New Product button -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Your Products</h4>
        <button class="btn btn-primary" id="btn-add-product">
            <i class="fas fa-plus me-1"></i> Add New Product
        </button>
    </div>

    <!-- Products Table -->
    <table class="table text-center">
        <thead class="table-dark">
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Price</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody id="products-tbody">
            <!-- JS fills this -->
        </tbody>
    </table>

</div>


<script src="Scripts/db.js"></script>
<script src="Scripts/script.js"></script>
<script src="Scripts/home.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
const session = DB.getSession();

if (!session || (session.role !== 'seller' && session.role !== 'admin')) {
    window.location.href = 'index.html';
}

const SELLER_ID = session.id;

function getProducts()      { return JSON.parse(localStorage.getItem('products') || '[]'); }
function saveProducts(arr)  { localStorage.setItem('products', JSON.stringify(arr)); }

const productModal = new bootstrap.Modal(document.getElementById('productModal'));
const editModal    = new bootstrap.Modal(document.getElementById('editmodal'));
const deleteModal  = new bootstrap.Modal(document.getElementById('deleteModal'));

let currentProductId = null;
//render prods
function renderProducts() {
    const tbody    = document.getElementById('products-tbody');
    const products = getProducts().filter(p => p.sellerId === SELLER_ID);

    if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-muted py-4">No products yet.</td></tr>`;
        return;
    }

    tbody.innerHTML = products.map(p => `
        <tr>
            <td class="py-3">
                <div class="product-img-wrap">
                    <img src="${p.image}" class="product-card" data-id="${p.id}" alt="${p.name}" style="height:180px; object-fit:contain; cursor:pointer;">
                </div>
            </td>
            <td class="align-middle">${p.name}</td>
            <td class="align-middle">$${p.price}</td>
            <td class="align-middle">${p.stock}</td>
        </tr>
    `).join('');

    document.querySelectorAll('.product-card').forEach(function(img) {
        img.addEventListener('click', function() {
            currentProductId = parseInt(img.getAttribute('data-id'));
            const product = getProducts().find(p => p.id === currentProductId);

            document.getElementById('modal-product-name').textContent        = product.name;
            document.getElementById('modal-product-price').textContent       = product.price;
            document.getElementById('modal-product-stock').textContent       = product.stock;
            document.getElementById('modal-product-description').textContent = product.Details;
            document.getElementById('modal-product-img').src                 = product.image;

            productModal.show();
        });
    });
}

// add item button function
document.getElementById('btn-add-product').addEventListener('click', function() {
    currentProductId = null;
    document.getElementById('edit-modal-title').textContent = 'Add New Product';
    document.getElementById('product-name').value = '';
    document.getElementById('price').value        = '';
    document.getElementById('stock').value        = '';
    document.getElementById('description').value  = '';
    document.getElementById('image').value        = '';
    document.getElementById('form-error').classList.add('d-none');
    editModal.show();
});

// edit button function
document.getElementById('btn-edit').addEventListener('click', function() {
    productModal.hide();
    const product = getProducts().find(p => p.id === currentProductId);
    if (!product) return;

    document.getElementById('edit-modal-title').textContent = 'Edit Product';
    document.getElementById('product-name').value = product.name;
    document.getElementById('price').value        = product.price;
    document.getElementById('stock').value        = product.stock;
    document.getElementById('description').value  = product.Details;
    document.getElementById('image').value        = '';
    document.getElementById('form-error').classList.add('d-none');
    editModal.show();
});

// save function
document.getElementById('btn-save').addEventListener('click', function() {
    const name        = document.getElementById('product-name').value.trim();
    const price       = document.getElementById('price').value.trim();
    const stock       = document.getElementById('stock').value.trim();
    const description = document.getElementById('description').value.trim();
    const imageInput  = document.getElementById('image');
    const errorBox    = document.getElementById('form-error');

    if (!name || !price || !stock) {
        errorBox.textContent = 'Name, price and stock are required.';
        errorBox.classList.remove('d-none');
        return;
    }
    errorBox.classList.add('d-none');

    function doSave(imageSrc) {
        const products = getProducts();
        if (currentProductId === null) {
            products.push({
                id: Date.now(), name, price: Number(price), stock: Number(stock),
                Details: description, image: imageSrc || 'Imgs/prod1.png',
                category: 'Electronics', sellerId: SELLER_ID
            });
        } else {
            const i = products.findIndex(p => p.id === currentProductId);
            if (i !== -1) {
                products[i].name    = name;
                products[i].price   = Number(price);
                products[i].stock   = Number(stock);
                products[i].Details = description;
                if (imageSrc) products[i].image = imageSrc;
            }
        }
        saveProducts(products);
        editModal.hide();
        renderProducts();
    }

    if (imageInput.files.length > 0) {
        const reader = new FileReader();
        reader.onload = function(e) { doSave(e.target.result); };
        reader.readAsDataURL(imageInput.files[0]);
    } else {
        doSave(null);
    }
});

// delete
document.getElementById('btn-delete').addEventListener('click', function() {
    productModal.hide();
    const product = getProducts().find(p => p.id === currentProductId);
    if (!product) return;
    document.getElementById('delete-product-name').textContent = product.name;
    deleteModal.show();
});

document.getElementById('btn-confirm-delete').addEventListener('click', function() {
    saveProducts(getProducts().filter(p => p.id !== currentProductId));
    deleteModal.hide();
    renderProducts();
});

//start
renderProducts();
</script>

</body>
</html>
