<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard</title>
</head>
<!-- Font Awesome CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<!-- Bootstrap CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<!-- Animate.css -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
<!-- Team CSS -->
<link rel="stylesheet" href="Styles/style.css">
<link rel="stylesheet" href="Styles/Home.css">
<link rel="stylesheet" href="Styles/media.css">
<!-- New seller dashboard CSS -->
<link rel="stylesheet" href="Styles/seller-dashboard.css">

<style>
    img{
        border-radius: 4px;
    }

    .img-wrap {
        background: #F5F5F5;
        border-radius: 4px;
        overflow: hidden;      /* keeps grow inside the box */
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 200px;
    }

    .img-wrap img {
        height: 160px;
        width: 160px;
        object-fit: contain;
        cursor: pointer;
        transition: transform 0.3s ease;
    }

    .img-wrap img:hover {
        transform: scale(1.1);
    }
    img:hover {
        transform: scale(1.1);
        transition-duration: 0.3s;
    }
</style>

<body>

<!-- View Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-product-name">Product Name</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <img id="modal-product-img" src="" class="img-fluid mb-3 rounded" style="max-height:200px;">
                <p><strong>Price:</strong> $<span id="modal-product-price"></span></p>
                <p><strong>Stock:</strong> <span id="modal-product-stock"></span></p>
                <p id="modal-product-description" class="text-muted"></p>
            </div>
            <div class="modal-footer justify-content-between">
                <button class="btn btn-danger" id="btn-delete">
                    <i class="fas fa-trash me-1"></i> Delete
                </button>
                <button class="btn btn-warning" id="btn-edit">
                    <i class="fas fa-edit me-1"></i> Edit
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Edit / Add Product Modal - CHANGED: file input to URL input -->
<!-- Edit / Add Product Modal -->
<div class="modal fade" id="editmodal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="edit-modal-title">Edit Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" class="form-control" id="product-name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" class="form-control" id="product-category" placeholder="e.g., Electronics, Clothing, Books">
                </div>
                <div class="mb-3">
                    <label class="form-label">Price</label>
                    <input type="number" class="form-control" id="price">
                </div>
                <div class="mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" class="form-control" id="stock">
                </div>
                <div class="mb-3">
                    <label class="form-label">Image URL</label>
                    <input type="text" class="form-control" id="image-url" placeholder="https://example.com/image.jpg">
                    <small class="text-muted">Enter direct link to image</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Details (comma separated)</label>
                    <textarea class="form-control" id="description" rows="3" placeholder="e.g., 4GB RAM, 128GB Storage, Blue color"></textarea>
                </div>
                <div id="form-error" class="alert alert-danger d-none"></div>
            </div>
            <div class="modal-footer justify-content-between">
                <button class="btn btn-danger" data-bs-dismiss="modal">
                    <i class="fa-solid fa-x me-1"></i> Cancel
                </button>
                <button class="btn btn-warning" id="btn-save">
                    <i class="fas fa-save me-1"></i> Save
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete <strong id="delete-product-name"></strong>?</p>
            </div>
            <div class="modal-footer justify-content-between">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger btn-sm" id="btn-confirm-delete">Delete</button>
            </div>
        </div>
    </div>
</div>


<!-- Mobile Search -->
<div class="d-lg-none d-md-none p-3 bg-light border-top">
    <div class="position-relative w-100">
        <input class="form-control rounded-5 py-2 ps-4 pe-5" type="search" placeholder="What are you looking for?" />
        <i class="fas fa-search position-absolute top-50 end-0 me-3 translate-middle-y text-secondary"></i>
    </div>
</div>

<!-- Dashboard -->
<div class="container py-4">

    <!-- Add New Product button -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Your Products</h4>
        <button class="btn btn-primary" id="btn-add-product">
            <i class="fas fa-plus me-1"></i> Add New Product
        </button>
    </div>

    <!-- Products Table -->
    <table class="table text-center">
        <thead class="table-dark">
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Price</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody id="products-tbody">
            <!-- JS fills this -->
        </tbody>
    </table>

</div>


<script src="Scripts/db.js"></script>
<!-- <script src="Scripts/home.js"></script> -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="Scripts/seller-dashboard.js"></script>

</body>
</html>
